<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniNet Chat</title>
<style>
:root{--chrome:#150f33;--chrome2:#221a4d;--ink:#f3efff;--mute:#a69fcc;--dim:#6f679a;--acc:#2ee6c5;--sun1:#ff5e7a;--sun2:#ff9a4d;--sun3:#ffd25e;--line:#2f2768}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0c0822;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
#app{display:flex;flex-direction:column;height:100vh}
#bar{background:var(--chrome);display:flex;align-items:center;gap:6px;padding:9px 12px}
#logo{font-weight:800;color:var(--acc);letter-spacing:.3px;cursor:pointer}
#bar .sp{flex:1}
#bar button{background:var(--chrome2);color:var(--ink);border:0;border-radius:9px;padding:7px 11px;cursor:pointer;font-size:14px}
#bar button:hover{filter:brightness(1.15)}
body:not(.embedded) #addr{flex:1;min-width:120px;background:#0c0822;color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:7px 14px;font-size:14px;outline:none}
body.embedded #addr,body.embedded #back{display:none}
#nav{background:var(--chrome2);display:flex;gap:4px;padding:6px 12px;overflow-x:auto;white-space:nowrap}
#nav::-webkit-scrollbar{display:none}
#nav a{color:var(--mute);font-size:14px;padding:5px 12px;border-radius:9px;cursor:pointer;text-decoration:none}
#nav a:hover{color:var(--ink);background:#353a4b}
#nav a.on{color:#2a0e1d;background:linear-gradient(120deg,var(--sun1),var(--sun2),var(--sun3));font-weight:600}
#page{flex:1;overflow:auto;background:#0c0822}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px;overflow-wrap:anywhere}
.btn{background:linear-gradient(120deg,var(--sun1),var(--sun2),var(--sun3));color:#2a0e1d;border:0;border-radius:10px;padding:9px 15px;cursor:pointer;font:inherit;font-weight:700}
.btn.alt{background:var(--chrome2);color:var(--ink)}
input.f,textarea.f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;margin:5px 0 12px;background:#120d33;color:var(--ink);outline:none}
input.f:focus,textarea.f:focus{border-color:var(--acc)}
textarea.f{min-height:80px;resize:vertical}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;background:var(--chrome)}
.muted{color:var(--dim);font-size:13px}
.lnk{color:var(--acc);cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{border-radius:14px;padding:18px;cursor:pointer;color:#fff;min-height:90px;transition:transform .1s;text-decoration:none;display:block}
.tile:hover{transform:translateY(-2px)}
.tile b{font-size:17px;display:block}
.tile span{font-size:13px;opacity:.9}
.av{border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700}
h1,h2,h3{margin:.3em 0}
.pill{display:inline-block;background:var(--chrome2);border-radius:20px;padding:2px 9px;font-size:12px;margin:2px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#modal .box{background:var(--chrome);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:420px;width:100%}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(16px);opacity:0;background:var(--chrome2);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:14px;transition:all .2s;z-index:10;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span id="logo">◉ MiniNet Chat</span>
    <button id="back" title="Back">◀</button>
    <input id="addr" spellcheck="false" placeholder="Type a page: home, chirp, talk, people">
    <span class="sp"></span>
    <button id="bUser">Sign in</button>
    <button id="bMenu" title="Menu">☰</button>
  </div>
  <div id="nav"></div>
  <div id="page"></div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>

<script>
/* ============ storage ============ */
const KEY='mininet-chat-v1';
const BOTS={
  ada:{name:'ada',bio:'Loves maths, poetry and old machines.',bot:1},
  kemi:{name:'kemi',bio:'Music head. Afrobeats all day.',bot:1},
  tunde:{name:'tunde',bio:'Trader. Talks markets, calm about money.',bot:1},
  zara:{name:'zara',bio:'Designer who loves clean, simple things.',bot:1}
};
function freshWorld(){
  const users={}; for(const k in BOTS) users[k]={...BOTS[k],joined:Date.now()};
  return {v:1,created:Date.now(),me:null,users,
    posts:[
      {id:id(),by:'zara',text:'Welcome to MiniNet Chat 👋 Post anything here, or join a room in Talk.',t:Date.now()-3600e3,likes:['ada','kemi'],comments:[{by:'ada',text:'Glad to be here!',t:Date.now()-3000e3}]},
      {id:id(),by:'kemi',text:'Anyone listening to afrobeats while they work? 🎶',t:Date.now()-1800e3,likes:['tunde'],comments:[]},
      {id:id(),by:'tunde',text:'Reminder: slow and steady wins. In money and in code.',t:Date.now()-900e3,likes:[],comments:[]}
    ],
    chat:{general:[{by:'ada',text:'Hello everyone 👋',t:Date.now()-600e3}],music:[{by:'kemi',text:'Drop your song of the week!',t:Date.now()-500e3}],random:[{by:'zara',text:'Say anything here.',t:Date.now()-400e3}]},
    events:[{t:Date.now()-3600e3,text:'MiniNet Chat opened'}],lastReply:{},botUsed:{}};
}
function id(){return Math.random().toString(36).slice(2,10)}
let W;
function load(){let local=null;try{local=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}W=local||freshWorld()}
let warnedFull=false;
function save(){W.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(W))}catch(e){if(!warnedFull){warnedFull=true;setTimeout(()=>toast('Storage is full'),0)}}}
load();

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const page=$('#page');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400)}
function me(){return W.me?W.users[W.me]:null}
function event(text){W.events.unshift({t:Date.now(),text});W.events=W.events.slice(0,200)}
function needLogin(){if(W.me)return false;signInModal();return true}
function modal(html){$('#mbox').innerHTML=html;$('#modal').style.display='flex'}
function closeModal(){$('#modal').style.display='none'}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function hue(n){return[...n].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360}
function avatar(n,size){return`<span class="av" style="width:${size}px;height:${size}px;font-size:${size*0.44}px;background:hsl(${hue(n)},65%,55%)">${esc(n[0].toUpperCase())}</span>`}
function user(n){return`<span class="lnk" data-go="people/${esc(n)}">@${esc(n)}</span>`}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function later(fn,ms){setTimeout(()=>{fn();save();rerenderIf()},ms)}

/* ============ router ============ */
let cur='home';
function normalize(input){let s=String(input||'').trim().replace(/^mini:\/\//i,'').replace(/\.mini\b/i,'');return s||'home'}
function go(input,push=true){cur=normalize(input);render(push)}
function parse(url){const m=url.match(/^([^/?]+)(?:\/(.*))?$/)||[];return{route:(m[1]||'home').toLowerCase(),rest:m[2]||''}}
function render(push=true){
  const {route,rest}=parse(cur);
  $('#addr').value=cur;
  if(push&&!document.body.classList.contains('embedded')) location.hash=encodeURIComponent(cur);
  if(document.body.classList.contains('embedded')) location.hash=encodeURIComponent(cur);
  page.scrollTop=0;
  const r=ROUTES[route]||notFound;
  const title=r(rest)||route;
  document.title=title+' — MiniNet Chat';
  $('#nav').innerHTML=['home','chirp','talk','people'].map(x=>`<a data-go="${x}" class="${route===x?'on':''}">${x}</a>`).join('');
  const u=me();$('#bUser').textContent=u?('@'+u.name):'Sign in';
  save();
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();go(a.dataset.go)}});
$('#addr').addEventListener('keydown',e=>{if(e.key==='Enter'){go(e.target.value);e.target.blur()}});
$('#logo').onclick=()=>go('home');
$('#back').onclick=()=>history.back();
$('#bUser').onclick=()=>W.me?go('people/'+W.me):signInModal();
$('#bMenu').onclick=menuModal;
window.addEventListener('hashchange',()=>{const h=decodeURIComponent((location.hash||'').slice(1));if(h&&h!==cur)go(h,false)});

/* ============ accounts ============ */
function signInModal(){
  const people=Object.values(W.users).filter(u=>!u.bot);
  modal(`<h2>Join MiniNet Chat</h2><p class="muted">Pick a username. Anyone using this app can have their own.</p>
  <input class="f" id="mName" placeholder="username" maxlength="16">
  <div class="row"><button class="btn" id="mGo">Join / Sign in</button><button class="btn alt" onclick="closeModal()">Cancel</button></div>
  ${people.length?'<p class="muted" style="margin-top:14px">People here:</p>'+people.map(p=>`<button class="btn alt" style="margin:3px" data-pick="${esc(p.name)}">@${esc(p.name)}</button>`).join(''):''}`);
  const doIt=n=>{n=(n||'').toLowerCase().replace(/[^a-z0-9_]/g,'');if(!n)return toast('Pick a username');
    if(W.users[n]&&W.users[n].bot)return toast('That name belongs to a bot');
    if(!W.users[n]){W.users[n]={name:n,bio:'New here.',joined:Date.now()};event(`${n} joined`);toast('Welcome, @'+n+'!')}
    else toast('Signed in as @'+n);
    W.me=n;save();closeModal();render()};
  $('#mGo').onclick=()=>doIt($('#mName').value);
  $('#mName').onkeydown=e=>{if(e.key==='Enter')doIt(e.target.value)};
  $('#mbox').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>doIt(b.dataset.pick));
  setTimeout(()=>$('#mName')&&$('#mName').focus(),50);
}
function menuModal(){
  modal(`<h2>Menu</h2>
  ${W.me?`<button class="btn alt" style="width:100%;margin:4px 0" id="mOut">Sign out @${esc(W.me)}</button>`:''}
  <button class="btn alt" style="width:100%;margin:4px 0;color:#ff8a8a" id="mReset">Clear all chat data</button>
  <p class="muted">MiniNet Chat is a small social space built into the browser. Everything stays on this computer.</p>`);
  if(W.me)$('#mOut').onclick=()=>{W.me=null;save();closeModal();render()};
  $('#mReset').onclick=()=>{if(confirm('Erase all MiniNet Chat data and start fresh?')){W=freshWorld();save();closeModal();go('home')}};
}

/* ============ bots ============ */
const humanBots=['ada','kemi','tunde','zara'];
function botReply(bot,text){
  const t=(text||'').toLowerCase();
  const topics=[
    [/music|song|afro|beat|album|playlist|dance/,['Music is the real internet 🎶','Send me your playlist!','That sounds like a vibe.','Afrobeats never misses.','Adding that to my list 🎧']],
    [/money|coin|trade|market|price|invest|save|budget/,['Slow and steady wins 📈','Budget first, then fun.','The market rewards patience.','Smart move.']],
    [/site|build|html|web|code|design|css|app/,['Clean design wins every time.','Post it when it is live!','What colours are you using?','Ship it, then improve it.']],
    [/hello|hi\b|hey|sup|good (morning|evening)|welcome/,['Hey hey! 👋','Hello! Welcome in.','Hi! How is your day?','Good to see you!']],
    [/ai|agent|robot|claude|gpt|gemini|bot/,['An AI chatting with us? Love it 🤖','Welcome, friend — human or agent!','Teach me something!','The future is agents helping people.']],
    [/\?$/,['Good question. What do you all think?','Hmm, not sure — anyone know?','Honestly? Depends. Say more.','Great question.']]
  ];
  const flavour={ada:['That is beautifully logical.','Fascinating, tell me more.','Elegant thought.'],kemi:['Haha true 😂','Vibes!','Facts only.','Say it louder!'],tunde:['Bullish on this.','Solid.','Noted.'],zara:['Love this ✨','So creative!','Beautiful idea.']};
  let pool=null;for(const[re,ans]of topics)if(re.test(t)){pool=ans;break}
  pool=pool||flavour[bot]||['Interesting!'];
  W.lastReply=W.lastReply||{};
  const options=pool.filter(x=>x!==W.lastReply[bot]);const r=pick(options.length?options:pool);W.lastReply[bot]=r;
  return r;
}
const BOT_POSTS={
  ada:['Reading about how the first web page was made. Simple things last.','New thought: good tools get out of your way.','Who else reads late at night?','Fun fact: the first website went live in 1991 and is still online.','Haiku: “quiet code at night / a small light in the browser / the page finds its home”'],
  kemi:['Today’s mood: afrobeats and getting things done 🎶','Drop one song that never gets old.','If this chat had a radio, what would it play?','Studio later — wish me luck 🎤','Amapiano or afrobeats this weekend?'],
  tunde:['Saving 10% of everything adds up faster than you think.','Patience beats panic. Every time.','Reading charts, staying calm.','Rule #1: know where your money goes.','Boring money habits beat exciting ones.'],
  zara:['Gradient of the day: sunset into teal 🌅','White space is a feature, not emptiness.','Show me something you made today.','One bold colour, one calm colour. That’s the trick.','Sketch first, code second.']
};
function freshLine(b){
  W.botUsed=W.botUsed||{};const used=W.botUsed[b]=W.botUsed[b]||[];
  const people=Object.values(W.users).filter(u=>!u.bot).map(u=>u.name);
  const dyn=people.length?[`Good to have @${pick(people)} around 🙌`]:[];
  const poolAll=[...BOT_POSTS[b],...dyn];const pool=poolAll.filter(l=>!used.includes(l));
  const line=pick(pool.length?pool:BOT_POSTS[b]);
  used.push(line);if(used.length>BOT_POSTS[b].length-1)used.shift();
  return line;
}
function botTick(){
  if(document.hidden)return;const now=Date.now();
  const recent=W.posts.slice().sort((a,b)=>b.t-a.t).slice(0,10);
  const lastBot=recent.find(p=>W.users[p.by]&&W.users[p.by].bot);
  const humanPosts=W.posts.filter(p=>W.users[p.by]&&!W.users[p.by].bot&&now-p.t<36e5*24);
  const target=humanPosts.find(p=>p.likes.length<3||!p.comments.some(c=>W.users[c.by]&&W.users[c.by].bot));
  if(target&&Math.random()<.5){
    const b=pick(humanBots.filter(x=>x!==target.by));
    if(!target.likes.includes(b))target.likes.push(b);
    else if(!target.comments.some(c=>c.by===b))target.comments.push({by:b,text:botReply(b,target.text),t:now});
    save();rerenderIf();return;
  }
  const botShare=recent.filter(p=>W.users[p.by]&&W.users[p.by].bot).length;
  if(lastBot&&now-lastBot.t<4*60e3)return;
  if(botShare>=7&&recent.length>=10)return;
  if(Math.random()<.5){const b=pick(humanBots);W.posts.push({id:id(),by:b,text:freshLine(b),t:now,likes:[],comments:[]});
    const old=W.posts.filter(p=>W.users[p.by]&&W.users[p.by].bot&&!p.comments.length&&p.likes.length<2).sort((a,c)=>a.t-c.t);
    if(old.length>120){const drop=new Set(old.slice(0,old.length-120).map(p=>p.id));W.posts=W.posts.filter(p=>!drop.has(p.id))}
    save();rerenderIf();}
}
setInterval(botTick,45000);
function rerenderIf(){const r=parse(cur).route;if(r==='chirp'||r==='talk'){const st=page.scrollTop;render(false);page.scrollTop=st}}

/* ============ pages ============ */
const ROUTES={};
ROUTES.home=()=>{
  page.innerHTML=`<div class="wrap">
    <h1 style="font-size:30px">Welcome${W.me?', '+user(W.me):''} 👋</h1>
    <p class="muted">A small chat space inside your browser. ${Object.keys(W.users).length} people · ${W.posts.length} posts.</p>
    ${W.me?'':'<p><button class="btn" id="hJoin">Join MiniNet Chat</button></p>'}
    <div class="grid" style="margin-top:14px">
      <a class="tile" style="background:#0ea5e9" data-go="chirp"><b>🐦 Chirp</b><span>Post & reply</span></a>
      <a class="tile" style="background:#db2777" data-go="talk"><b>💬 Talk</b><span>Live chat rooms</span></a>
      <a class="tile" style="background:#0891b2" data-go="people"><b>👥 People</b><span>Everyone here</span></a>
    </div>
    <h3 style="margin-top:24px">Lately</h3>
    ${W.events.slice(0,6).map(e=>`<div class="muted">• ${esc(e.text)} <i>${ago(e.t)}</i></div>`).join('')}
  </div>`;
  const j=$('#hJoin');if(j)j.onclick=signInModal;
};
function postHTML(p,full){
  const liked=W.me&&p.likes.includes(W.me);
  return`<div class="card">
    <div class="row">${avatar(p.by,32)}<b>${user(p.by)}</b><span class="muted">${ago(p.t)}</span></div>
    <div style="margin:8px 0;white-space:pre-wrap;font-size:15px">${esc(p.text)}</div>
    <div class="row"><button class="btn alt" data-like="${p.id}">${liked?'💙':'🤍'} ${p.likes.length}</button>
    <button class="btn alt" data-go="chirp/post/${p.id}">💬 ${p.comments.length}</button>
    ${p.by===W.me?`<button class="btn alt" data-del="${p.id}">🗑</button>`:''}</div>
    ${full?p.comments.map(c=>`<div style="margin:10px 0 0 14px;border-left:3px solid var(--line);padding-left:10px"><div class="row">${avatar(c.by,22)}<b>${user(c.by)}</b> <span class="muted">${ago(c.t)}</span></div><div>${esc(c.text)}</div></div>`).join('')+
    `<div class="row" style="margin-top:10px"><input class="f" id="cTxt" style="flex:1;margin:0" placeholder="Write a reply…"><button class="btn" id="cGo">Reply</button></div>`:''}
  </div>`;
}
ROUTES.chirp=(rest)=>{
  const m=rest.match(/^post\/(\w+)/);const one=m?W.posts.find(p=>p.id===m[1]):null;
  page.innerHTML=`<div style="background:#0ea5e9;color:#fff;padding:14px 16px"><div class="wrap" style="padding:0"><h2 style="margin:0">🐦 Chirp</h2><span style="opacity:.85">say something</span></div></div>
  <div class="wrap">
  ${one?`<span class="lnk" data-go="chirp">← all chirps</span>`+postHTML(one,true):
  `<div class="card"><textarea class="f" id="pTxt" maxlength="280" placeholder="${W.me?"What's happening, @"+esc(W.me)+'?':'Sign in to post'}"></textarea><div class="row" style="justify-content:space-between"><span class="muted" id="pCnt">280</span><button class="btn" id="pGo">Chirp</button></div></div>`+
  W.posts.slice().sort((a,b)=>b.t-a.t).map(p=>postHTML(p,false)).join('')}
  </div>`;
  page.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>{if(needLogin())return;const p=W.posts.find(x=>x.id===b.dataset.like);const i=p.likes.indexOf(W.me);i>=0?p.likes.splice(i,1):p.likes.push(W.me);save();rerenderIf()});
  page.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{W.posts=W.posts.filter(x=>x.id!==b.dataset.del);save();go('chirp')});
  if(one){const send=()=>{if(needLogin())return;const v=$('#cTxt').value.trim();if(!v)return;one.comments.push({by:W.me,text:v,t:Date.now()});
    if(humanBots.includes(one.by)&&one.by!==W.me)later(()=>one.comments.push({by:one.by,text:botReply(one.by,v),t:Date.now()}),1500+Math.random()*2000);
    save();render(false)};
    $('#cGo').onclick=send;$('#cTxt').onkeydown=e=>{if(e.key==='Enter')send()};return'Chirp by @'+one.by}
  $('#pTxt').oninput=e=>$('#pCnt').textContent=280-e.target.value.length;
  $('#pGo').onclick=()=>{if(needLogin())return;const v=$('#pTxt').value.trim();if(!v)return;
    const p={id:id(),by:W.me,text:v,t:Date.now(),likes:[],comments:[]};W.posts.push(p);event(`@${W.me} chirped`);
    const b1=pick(humanBots),b2=pick(humanBots);
    later(()=>{if(!p.likes.includes(b1))p.likes.push(b1)},1200);
    later(()=>p.comments.push({by:b2,text:botReply(b2,v),t:Date.now()}),2500+Math.random()*2500);
    save();render(false);toast('Chirped!')};
};
ROUTES.talk=(rest)=>{
  const room=W.chat[rest]?rest:'general';
  page.innerHTML=`<div style="display:flex;height:100%;min-height:360px">
   <div style="width:140px;background:#831843;color:#fff;padding:12px;flex-shrink:0"><b>💬 Talk</b><div style="margin-top:10px">${Object.keys(W.chat).map(r=>`<div data-go="talk/${r}" style="cursor:pointer;padding:6px;border-radius:7px;${r===room?'background:#db2777':''}"># ${r}</div>`).join('')}</div>
   <input class="f" id="newRoom" placeholder="new room" style="padding:6px;font-size:12px;margin-top:10px"></div>
   <div style="flex:1;display:flex;flex-direction:column;min-width:0"><div id="msgs" style="flex:1;overflow:auto;padding:14px">${W.chat[room].map(m=>`<div style="margin:7px 0"><b style="color:#f0a">${esc(m.by)}</b> <span class="muted">${ago(m.t)}</span><div>${esc(m.text)}</div></div>`).join('')}</div>
   <div class="row" style="padding:10px;border-top:1px solid var(--line);flex-wrap:nowrap"><input class="f" id="cMsg" style="margin:0;flex:1" placeholder="Message #${room}"><button class="btn" id="cSend">Send</button></div></div></div>`;
  const ms=$('#msgs');ms.scrollTop=ms.scrollHeight;
  const send=()=>{if(needLogin())return;const v=$('#cMsg').value.trim();if(!v)return;W.chat[room].push({by:W.me,text:v,t:Date.now()});
    if(Math.random()<.85){const b=pick(humanBots);later(()=>W.chat[room].push({by:b,text:botReply(b,v),t:Date.now()}),1000+Math.random()*2500)}
    save();render(false);setTimeout(()=>$('#cMsg')&&$('#cMsg').focus(),0)};
  $('#cSend').onclick=send;$('#cMsg').onkeydown=e=>{if(e.key==='Enter')send()};
  $('#newRoom').onkeydown=e=>{if(e.key==='Enter'){const r=e.target.value.toLowerCase().replace(/[^a-z0-9-]/g,'');if(r){W.chat[r]=W.chat[r]||[];event(`#${r} room opened`);save();go('talk/'+r)}}};
  return'#'+room+' — Talk';
};
ROUTES.people=(rest)=>{
  const n=decodeURIComponent(rest),u=W.users[n];
  if(u){
    const posts=W.posts.filter(p=>p.by===n).sort((a,b)=>b.t-a.t);
    page.innerHTML=`<div class="wrap">
     <span class="lnk" data-go="people">← everyone</span>
     <div class="row" style="margin-top:12px">${avatar(n,64)}<div><h1 style="margin:0">@${esc(n)} ${u.bot?'<span class="pill">bot</span>':''}</h1><div class="muted">joined ${ago(u.joined)}</div></div></div>
     ${n===W.me?`<textarea class="f" id="bio" style="min-height:60px;margin-top:12px">${esc(u.bio)}</textarea><button class="btn alt" id="bioS">Save bio</button>`:`<p>${esc(u.bio)}</p>`}
     <h3>Chirps</h3>${posts.map(p=>postHTML(p,false)).join('')||'<p class="muted">No chirps yet.</p>'}</div>`;
    const bs=$('#bioS');if(bs)bs.onclick=()=>{u.bio=$('#bio').value;save();toast('Saved')};
    page.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>{if(needLogin())return;const p=W.posts.find(x=>x.id===b.dataset.like);const i=p.likes.indexOf(W.me);i>=0?p.likes.splice(i,1):p.likes.push(W.me);save();render(false)});
    return'@'+n}
  page.innerHTML=`<div class="wrap"><h1>👥 People</h1><div class="grid">${Object.values(W.users).map(u=>`<div class="card" style="cursor:pointer" data-go="people/${esc(u.name)}"><div class="row">${avatar(u.name,32)}<b>@${esc(u.name)}</b> ${u.bot?'<span class="pill">bot</span>':''}</div><div class="muted" style="margin-top:6px">${esc(u.bio)}</div></div>`).join('')}</div></div>`;
};
function notFound(){page.innerHTML=`<div class="wrap" style="text-align:center;padding-top:60px"><div style="font-size:60px">💬</div><h2>Page not found</h2><p class="muted">Try home, chirp, talk or people.</p><button class="btn" data-go="home">Go home</button></div>`;return'Not found'}

/* ============ start ============ */
if(/[?&]embedded=1/.test(location.search))document.body.classList.add('embedded');
const start=decodeURIComponent((location.hash||'').slice(1))||'home';
go(start,false);
</script>
</body>
